syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.vmh.mvvmjetpackcompose.core.local";
option java_multiple_files = true;

message LocalUser {
  google.protobuf.UInt64Value id = 1;
  google.protobuf.StringValue email = 2;
  google.protobuf.StringValue full_name = 3;
  google.protobuf.StringValue avatar = 4;
  google.protobuf.Timestamp date_of_birth = 5;
  google.protobuf.StringValue phone_number = 6;
  google.protobuf.StringValue access_token = 7;
  google.protobuf.StringValue refresh_token = 8;
}
