name: Lint Check
on: pull_request

env:
  CI: true

concurrency:
  group: 'ci-${{ github.head_ref }}-${{ github.workflow }}'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.1

      - name: Set up Java JDK
        uses: actions/setup-java@v4.4.0
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.1.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew :app:assembleBaseDevDebug --stacktrace

      # TODO(ci): re-enable Danger once Gemfile is added (Ruby 2.7 + bundle
      # install removed because they failed on ubuntu-latest / ubuntu-24.04).
